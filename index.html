<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>分紙生成工具</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout: a teacher's mark book — ledger-ruled sheet on cool paper; sidebar of 分紙, numbered workflow tabs, spreadsheet grid as the centrepiece */
:root{
  --paper:#eef3f1; --sheet:#ffffff; --sheet-2:#f6f9f8; --ink:#16252c; --ink-2:#4d6068; --ink-3:#7b8d92;
  --rule:#d6e1dd; --rule-2:#b4c6c0;
  --accent:#17695a; --accent-ink:#ffffff; --accent-soft:#dbede8; --accent-2:#0f4e43;
  --redpen:#b8321f; --redpen-soft:#fbe5e0; --warn:#9a5d00; --warn-soft:#fff0cf; --ok:#1d7a3c;
  --c-ict:#2e5fc4; --c-computer:#17695a; --c-dt:#b0601a;
  --cat-0:#e3eef9; --cat-1:#e4f2ea; --cat-2:#fbefdc; --cat-3:#f3e6f3; --cat-4:#e8ecf7; --cat-5:#f6e8e4; --cat-6:#eaf3f2; --cat-7:#f2f0e0;
  --total-bg:#fff6d9;
  --shadow:0 1px 0 rgba(22,37,44,.04),0 6px 18px -10px rgba(22,37,44,.18);
  --f-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --f-display:"Noto Serif TC","PMingLiU","Songti TC",serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f171a; --sheet:#152126; --sheet-2:#1a282d; --ink:#e2ebe8; --ink-2:#a3b5b0; --ink-3:#73878a;
  --rule:#26363b; --rule-2:#3a5157;
  --accent:#4fb69e; --accent-ink:#0b1714; --accent-soft:#183a33; --accent-2:#7fd3bf;
  --redpen:#ff8a76; --redpen-soft:#3b1f1a; --warn:#f2b752; --warn-soft:#3a2c12; --ok:#6fd393;
  --c-ict:#83a7f2; --c-computer:#4fb69e; --c-dt:#e69a5c;
  --cat-0:#1b2a3a; --cat-1:#1a3026; --cat-2:#352a17; --cat-3:#2f2032; --cat-4:#212842; --cat-5:#36231f; --cat-6:#1a3231; --cat-7:#2f2d1b;
  --total-bg:#3a3217;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 20px -12px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f171a; --sheet:#152126; --sheet-2:#1a282d; --ink:#e2ebe8; --ink-2:#a3b5b0; --ink-3:#73878a;
  --rule:#26363b; --rule-2:#3a5157;
  --accent:#4fb69e; --accent-ink:#0b1714; --accent-soft:#183a33; --accent-2:#7fd3bf;
  --redpen:#ff8a76; --redpen-soft:#3b1f1a; --warn:#f2b752; --warn-soft:#3a2c12; --ok:#6fd393;
  --c-ict:#83a7f2; --c-computer:#4fb69e; --c-dt:#e69a5c;
  --cat-0:#1b2a3a; --cat-1:#1a3026; --cat-2:#352a17; --cat-3:#2f2032; --cat-4:#212842; --cat-5:#36231f; --cat-6:#1a3231; --cat-7:#2f2d1b;
  --total-bg:#3a3217;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 20px -12px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{background:var(--sheet);border-right:1px solid var(--rule);padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:18px}
.main{min-width:0;padding-block:22px 48px;padding-left:28px;padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{border-right:0;border-bottom:1px solid var(--rule);padding-right:max(16px,env(safe-area-inset-right,0px))}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .sheet-list{flex-direction:row!important;overflow-x:auto;padding-bottom:4px}
  .sheet-group{min-width:max-content}
}

.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-display);font-size:26px;letter-spacing:.04em;line-height:1.1}
.brand span{color:var(--ink-3);font-size:12px;letter-spacing:.12em}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.status[data-s="saved"] i{background:var(--ok)}
.status[data-s="saving"] i,.status[data-s="pending"] i{background:var(--warn)}
.status[data-s="error"] i{background:var(--redpen)}

.sheet-list{display:flex;flex-direction:column;gap:14px}
.sheet-group{display:flex;flex-direction:column;gap:4px}
.sheet-group h4{margin:0 0 2px;font-size:11px;letter-spacing:.14em;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.sheet-btn{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:1px;padding:8px 10px;border-radius:8px;border:1px solid transparent}
.sheet-btn:hover{background:var(--sheet-2)}
.sheet-btn:focus-visible{outline:2px solid var(--accent)}
.sheet-btn[aria-current="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.sheet-btn b{font-weight:600;font-size:14px}
.sheet-btn small{color:var(--ink-3);font-size:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--rule-2);background:var(--sheet);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;font-size:13.5px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--sheet-2);border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--redpen);border-color:color-mix(in srgb,var(--redpen) 45%,transparent)}
.btn.danger:hover{background:var(--redpen-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sheet-2)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:6px}
.btn.icon{padding:3px 7px;font-size:13px;border-radius:6px;min-width:28px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head h1{font-family:var(--f-display);font-size:28px;line-height:1.2;letter-spacing:.02em}
.meta{color:var(--ink-2);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px}
.subj-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.06em;padding:2px 8px;border-radius:5px;border:1px solid currentColor}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:10px 14px 9px;display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab span{font-family:var(--f-num);font-size:11px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--rule-2);color:var(--ink-3)}
.tab:hover{color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--accent)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab[aria-selected="true"] span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.card h3{font-size:16px;font-weight:700}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.hint{color:var(--ink-2);font-size:13px;margin:0;max-width:72ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.sub{border:1px dashed var(--rule-2);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sub h4{margin:0;font-size:14px}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.lbl{font-size:12px;color:var(--ink-2);font-weight:500}
.inp,select.inp,textarea.inp{border:1px solid var(--rule-2);background:var(--sheet);border-radius:7px;padding:6px 9px;min-width:0;width:100%}
.inp:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:0;border-color:var(--accent)}
textarea.inp{min-height:110px;resize:vertical;font-family:var(--f-num);font-size:12.5px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.inp:disabled,select.inp:disabled{opacity:.6;background:var(--sheet-2);cursor:not-allowed}
.inp::placeholder,textarea::placeholder{color:var(--ink-3);opacity:.75}
.check{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13.5px}
.check input{accent-color:var(--accent);width:16px;height:16px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--rule-2);font-weight:500;font-size:13.5px;background:var(--sheet)}
.chip:hover{border-color:var(--ink-3)}
.chip:focus-visible{outline:2px solid var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.chip .count{font-size:11.5px;opacity:.7;font-family:var(--f-num)}
.chip.add{border-style:dashed;color:var(--ink-2)}

.tbl-wrap{overflow:auto;border:1px solid var(--rule);border-radius:10px;max-width:100%}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th,.tbl td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:middle}
.tbl th{background:var(--sheet-2);font-size:12px;color:var(--ink-2);font-weight:600;white-space:nowrap}
.tbl td .inp{padding:4px 7px}
.tbl tr:last-child td{border-bottom:0}
.tbl .w-no{width:70px}.tbl .w-num{width:92px}.tbl .w-act{width:1%;white-space:nowrap}
.cat-band td{background:var(--sheet-2);font-weight:600}

/* score grid */
.grid-wrap{overflow:auto;max-height:72vh;border:1px solid var(--rule-2);border-radius:10px;background:var(--sheet)}
table.g{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.g th,.g td{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:0;white-space:nowrap}
.g thead th{position:sticky;background:var(--sheet-2);z-index:2;font-weight:600;padding:5px 8px;text-align:center}
.g thead tr:nth-child(1) th{top:0;height:30px}
.g thead tr:nth-child(2) th{top:30px;height:44px}
.g thead tr:nth-child(3) th{top:74px;height:28px;font-weight:400}
.g .stick1{position:sticky;left:0;z-index:3;background:var(--sheet)}
.g .stick2{position:sticky;left:52px;z-index:3;background:var(--sheet);border-right:2px solid var(--rule-2)}
.g thead .stick1,.g thead .stick2{z-index:4;background:var(--sheet-2)}
.g td.no{width:52px;min-width:52px;text-align:center;font-family:var(--f-num);color:var(--ink-2);padding:0 6px}
.g td.nm{min-width:120px;max-width:190px;padding:3px 10px;overflow:hidden;text-overflow:ellipsis}
.g td.nm small{display:block;color:var(--ink-3);font-size:11px;line-height:1.2}
.g .iname{display:block;max-width:150px;white-space:normal;line-height:1.25;font-size:12.5px}
.g .ifull{font-family:var(--f-num);font-size:11.5px;color:var(--ink-2);display:inline-flex;gap:4px;align-items:center}
.g .ifull .btn{padding:0 5px;font-size:11px;border-radius:4px;min-width:0}
.g input.sc{all:unset;box-sizing:border-box;width:100%;min-width:64px;height:34px;text-align:center;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13.5px;cursor:text}
.g input.sc:focus{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.g input.sc.bad{background:var(--redpen-soft);color:var(--redpen)}
.g input.sc.over{color:var(--redpen);font-weight:600}
.g input.sc.txt{color:var(--warn);font-family:var(--f-body)}
.g td.tot,.g th.tot{background:var(--total-bg);text-align:center;font-family:var(--f-num);font-weight:600;min-width:76px;padding:0 8px;position:sticky;right:0;z-index:1;border-left:2px solid var(--rule-2)}
.g thead th.tot{z-index:3}
.g td.tot.low{color:var(--redpen)}
.g td.rawv{text-align:center;font-family:var(--f-num);color:var(--ink-2);min-width:54px;padding:0 6px;background:var(--sheet-2)}
.g th.rawh{font-weight:500;color:var(--ink-2)}
.g td.na{background:repeating-linear-gradient(135deg,var(--sheet-2) 0 6px,var(--paper) 6px 12px);color:var(--ink-3);text-align:center;font-size:12px}
.pill.grp{background:var(--accent-soft);color:var(--accent);border-color:transparent;padding:0 6px;font-weight:600}
.g td.catv{text-align:center;font-family:var(--f-num);color:var(--ink-2);min-width:70px;padding:0 6px}
.g tfoot td{background:var(--sheet-2);font-family:var(--f-num);text-align:center;color:var(--ink-2);height:32px;position:sticky;bottom:0;z-index:2}
.g tfoot td.stick1,.g tfoot td.stick2{z-index:4;background:var(--sheet-2);font-family:var(--f-body)}
.g tfoot td.tot{z-index:3;background:var(--total-bg)}
.g tbody tr:hover td{background-image:linear-gradient(color-mix(in srgb,var(--accent) 6%,transparent),color-mix(in srgb,var(--accent) 6%,transparent))}
.c0{background:var(--cat-0)!important}.c1{background:var(--cat-1)!important}.c2{background:var(--cat-2)!important}.c3{background:var(--cat-3)!important}
.c4{background:var(--cat-4)!important}.c5{background:var(--cat-5)!important}.c6{background:var(--cat-6)!important}.c7{background:var(--cat-7)!important}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2)}
.legend code{font-family:var(--f-num);background:var(--sheet-2);border:1px solid var(--rule);border-radius:4px;padding:0 5px;color:var(--ink)}

.formula{font-family:var(--f-body);background:var(--sheet-2);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:8px;padding:12px 14px;line-height:1.9;font-size:14px;overflow-wrap:anywhere}
.formula .op{font-family:var(--f-num);color:var(--ink-3);padding:0 2px}
.formula .term{display:inline-block;background:var(--sheet);border:1px solid var(--rule);border-radius:5px;padding:0 6px;line-height:1.6;margin:1px 0}
.formula .term.bonus{border-style:dashed}
.formula b{color:var(--accent)}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.mode{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule-2);border-radius:10px;padding:12px 14px;cursor:pointer}
.mode:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.mode input{accent-color:var(--accent);margin-top:4px}
.mode b{display:block}
.mode small{color:var(--ink-2);font-size:12.5px;line-height:1.5;display:block}

.subjects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.subj{border:1px solid var(--rule-2);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.subj:has(input:checked){border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.subj input{position:absolute;opacity:0;pointer-events:none}
.subj b{font-size:18px;font-family:var(--f-display)}
.subj small{color:var(--ink-2);font-size:11.5px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--sheet-2)}
.stat small{display:block;color:var(--ink-2);font-size:12px}
.stat b{font-family:var(--f-num);font-size:22px;font-weight:600}

.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--sheet-2);border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.bad{background:var(--redpen-soft);color:var(--redpen);border-color:transparent}

.empty{display:flex;flex-direction:column;gap:16px;align-items:flex-start;max-width:640px;padding:36px 4px}
.empty h1{font-family:var(--f-display);font-size:34px;line-height:1.2}
.empty p{color:var(--ink-2);margin:0;font-size:15px}
.steps{display:grid;gap:8px;margin:4px 0;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:10px;align-items:baseline;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--f-num);font-size:11px;width:20px;height:20px;flex:none;border-radius:50%;display:grid;place-items:center;border:1px solid var(--rule-2);color:var(--ink-2)}

.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px dashed var(--rule-2);border-radius:10px;padding:18px 12px;text-align:center;cursor:pointer;color:var(--ink-2);font-size:13px;background:var(--sheet-2)}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--ink)}
.drop b{color:var(--accent)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}

.preview{display:flex;flex-direction:column;gap:8px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:14px}
.prev-row{display:grid;grid-template-columns:auto 110px auto minmax(0,1fr);gap:10px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:8px 10px}
.prev-row small{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@media (max-width:560px){.prev-row{grid-template-columns:auto 1fr auto}.prev-row small{grid-column:1/-1}}

.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--sheet);border:1px solid var(--rule-2);border-radius:14px;box-shadow:0 20px 60px -20px rgba(0,0,0,.45);width:min(620px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.modal h2{font-family:var(--f-display);font-size:22px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.form2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.form2{grid-template-columns:minmax(0,1fr)}.subjects{grid-template-columns:minmax(0,1fr)}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:9px 16px;border-radius:9px;font-size:13.5px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.muted{color:var(--ink-3)}
.sumline{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.sumline b{color:var(--ink);font-family:var(--f-num)}

<script>
"use strict";
/* ============ constants ============ */
const SUBJ = {
  ict:      {name:'ICT', full:'資訊及通訊科技', color:'var(--c-ict)', blurb:'功課・測驗・課堂表現'},
  computer: {name:'電腦', full:'電腦科', color:'var(--c-computer)', blurb:'功課・堂課・默書・評估'},
  dt:       {name:'DT', full:'設計與科技', color:'var(--c-dt)', blurb:'繪圖・習作・製作・測驗'}
};
const SUBJ_ORDER = ['ict','computer','dt'];
const FORMS = ['F1','F2','F3','F4','F5','F6'];
const FORM_ZH = {F1:'中一',F2:'中二',F3:'中三',F4:'中四',F5:'中五',F6:'中六'};
const TERMS = ['第一學期','第二學期','全年'];
const CAT_PRESETS = ['堂課','功課','測驗','默書','課堂表現','評估','專題研習','實作','考試'];
const LS_KEY = 'marksheet-tool-v1';
const LS_UI = 'marksheet-tool-ui';

/* ============ state ============ */
const S = { sheets:[], settings:{school:'', teacher:''}, curId:null, tab:'roster', classId:null, importPreview:null, storage:'local' };

/* ============ helpers ============ */
const $ = (sel, root=document) => root.querySelector(sel);
const uid = p => p + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2,6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
function roundTo(x, d){ const m = 10 ** d; return Math.sign(x) * Math.round(Math.abs(x) * m + 1e-9) / m; }
function fmt(x, d){ if (x === null || x === undefined || !Number.isFinite(x)) return '—'; return roundTo(x, d).toFixed(d); }
function fmtN(x){ if (!Number.isFinite(x)) return '—'; return String(roundTo(x, 2)); }
function schoolYear(){ const d = new Date(); const y = d.getFullYear(); return d.getMonth() >= 7 ? `${y}-${y+1}` : `${y-1}-${y}`; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
const cur = () => S.sheets.find(s => s.id === S.curId) || null;
const curClass = sh => sh ? (sh.classes.find(c => c.id === S.classId) || sh.classes[0] || null) : null;
function sheetTitle(sh){ return `${FORM_ZH[sh.form] || sh.form} ${SUBJ[sh.subject].name}`; }
function stuName(st){ return st.zh || st.en || '（未命名）'; }
function catIndex(sh, catId){ return Math.max(0, sh.categories.findIndex(c => c.id === catId)) % 8; }
function orderedItems(sh){
  const order = new Map(sh.categories.map((c,i) => [c.id, i]));
  return sh.items.map((it, i) => [it, i]).sort((a,b) => ((order.get(a[0].catId) ?? 999) - (order.get(b[0].catId) ?? 999)) || a[1]-b[1]).map(x => x[0]);
}
function rawOf(sh, it){ const ri = sh.typeInfo && sh.typeInfo[it.id]; return ri && ri.data && Object.keys(ri.data).length ? ri : null; }
function sumWeights(sh, grp){ return sh.items.filter(i => !i.bonus && (!sh.groups || !i.group || !grp || i.group === grp)).reduce((a,i) => a + num(i.weight), 0); }

/* ============ templates ============ */
function makeTemplate(subject){
  const cat = name => ({id: uid('c'), name, weight: 0});
  const item = (c, name, full, weight, extra={}) => ({id: uid('i'), catId: c.id, name, content:'', date:'', full, weight: weight ?? full, bonus:false, ...extra});
  if (subject === 'computer'){
    const hw = cat('功課'), cw = cat('堂課'), dict = cat('默書'), ass = cat('評估'), cp = cat('課堂表現');
    const cats = [hw, cw, dict, ass, cp];
    const items = [
      item(hw,'掃瞄功課',8), item(hw,'電子安全',18), item(hw,'第一章習作1',22), item(hw,'第一章習作2',18),
      item(cw,'40分堂課',40), item(dict,'英文生字默書',7.5,33), item(ass,'英文打字',50), item(cp,'課堂表現',30)
    ];
    autoCatWeights(cats, items);
    return {categories: cats, items, calc:{mode:'item', total:50, cap:true, decimals:1, blank:'zero', catMethod:'sum'}};
  }
  if (subject === 'dt'){
    const dr = cat('繪圖'), de = cat('設計習作'), mk = cat('製作習作'), ts = cat('測驗'), cp = cat('課堂表現');
    const cats = [dr, de, mk, ts, cp];
    const items = [
      item(dr,'均角投影法 (A2)',20,20), item(dr,'繪圖 bonus',8,2,{bonus:true}),
      item(de,'電路圖 (B2)',40,25,{group:'上'}), item(de,'設計習作',40,25,{group:'下'}),
      item(mk,'紙電路製作 (C2)',40,30,{group:'上'}), item(mk,'製作習作',40,30,{group:'下'}),
      item(ts,'測驗',26,20), item(cp,'課堂表現',10,5)
    ];
    autoCatWeights(cats, items.filter(i => i.group !== '下'));
    return {categories: cats, items, groups: true, calc:{mode:'item', total:50, cap:true, decimals:1, blank:'zero', catMethod:'sum'}};
  }
  const hw = cat('功課'), ts = cat('測驗'), cp = cat('課堂表現');
  hw.weight = 30; ts.weight = 50; cp.weight = 20;
  const items = [ item(hw,'功課 1',20), item(hw,'功課 2',20), item(ts,'測驗 1',50), item(cp,'課堂表現',10) ];
  return {categories:[hw, ts, cp], items, calc:{mode:'category', total:100, cap:true, decimals:1, blank:'zero', catMethod:'sum'}};
}
function autoCatWeights(cats, items){
  const tot = items.filter(i => !i.bonus).reduce((a,i) => a + num(i.weight), 0) || 1;
  let acc = 0;
  cats.forEach((c, k) => {
    const w = items.filter(i => !i.bonus && i.catId === c.id).reduce((a,i) => a + num(i.weight), 0);
    c.weight = k === cats.length - 1 ? Math.max(0, roundTo(100 - acc, 1)) : roundTo(w / tot * 100, 1);
    acc += c.weight;
  });
}
function newSheet(o){
  const t = o.template || makeTemplate(o.subject);
  return {
    id: uid('m'), subject:o.subject, form:o.form, year:o.year, term:o.term, teacher:o.teacher || '',
    categories: t.categories, items: t.items, calc: t.calc, groups: !!t.groups,
    classes: o.classes || [], createdAt: Date.now(), updatedAt: Date.now()
  };
}
function copyScheme(src){
  const map = {}; const cats = src.categories.map(c => { const n = {...c, id: uid('c')}; map[c.id] = n.id; return n; });
  const items = src.items.map(i => ({...i, id: uid('i'), catId: map[i.catId]}));
  return {categories: cats, items, calc: clone(src.calc), groups: !!src.groups};
}
function copyClasses(src, ids){
  return src.classes.filter(c => !ids || ids.includes(c.id)).map(c => ({id: uid('k'), name: c.name, students: c.students.map(s => ({...s, id: uid('s')})), scores:{}}));
}

/* ============ calculation ============ */
function itemState(sh, v){
  if (v === '免') return {inc:false};
  if (v === '缺') return {inc:true, n:0};
  if (v === undefined || v === null || v === '') return sh.calc.blank === 'zero' ? {inc:true, n:0, blank:true} : {inc:false, blank:true};
  return {inc:true, n:+v};
}
const GROUPS = ['上', '下'];
const GROUP_NAME = {'上':'上半班', '下':'下半班'};
/* half-class groups: an item tagged 上/下 only counts for students of that group; a student with no group counts it only if a mark is entered */
function applies(sh, it, grp, sc){
  if (!sh.groups || !it.group) return true;
  if (grp) return it.group === grp;
  const v = sc ? sc[it.id] : undefined; return v !== undefined && v !== null && v !== '';
}
function computeStudent(sh, sc, grp){
  sc = sc || {};
  const c = sh.calc, T = num(c.total), items = orderedItems(sh).filter(it => applies(sh, it, grp, sc));
  if (!items.some(it => sc[it.id] !== undefined && sc[it.id] !== null && sc[it.id] !== '')) return {total:null, cats:{}, bonus:0, empty:true};
  let bonus = 0;
  for (const it of items) if (it.bonus){ const s = itemState(sh, sc[it.id]); if (s.inc && num(it.full) > 0) bonus += s.n / num(it.full) * num(it.weight); }
  let base = null; const cats = {};
  if (c.mode === 'item'){
    let n = 0, d = 0;
    for (const it of items){ if (it.bonus) continue; const s = itemState(sh, sc[it.id]); if (!s.inc || !(num(it.full) > 0)) continue; n += s.n / num(it.full) * num(it.weight); d += num(it.weight); }
    if (d > 0) base = n / d * T;
  } else {
    let acc = 0, ws = 0;
    for (const cat of sh.categories){
      const its = items.filter(i => !i.bonus && i.catId === cat.id);
      if (!its.length) continue;
      const inc = its.map(i => [i, itemState(sh, sc[i.id])]).filter(([i,s]) => s.inc && num(i.full) > 0);
      if (!inc.length){ cats[cat.id] = null; continue; }
      const frac = c.catMethod === 'avg' ? inc.reduce((a,[i,s]) => a + s.n / num(i.full), 0) / inc.length
                                          : inc.reduce((a,[i,s]) => a + s.n, 0) / inc.reduce((a,[i]) => a + num(i.full), 0);
      cats[cat.id] = frac * num(cat.weight); acc += frac * num(cat.weight); ws += num(cat.weight);
    }
    if (ws > 0) base = acc / ws * T;
  }
  if (base === null) return {total:null, cats, bonus};
  let t = base + bonus; if (c.cap) t = Math.min(T, t);
  return {total: roundTo(t, +c.decimals), cats, bonus};
}
function classStats(sh, cls){
  const totals = cls.students.map(st => computeStudent(sh, cls.scores[st.id], st.group).total).filter(x => x !== null);
  const T = num(sh.calc.total);
  const avg = totals.length ? totals.reduce((a,b) => a+b, 0) / totals.length : null;
  let blanks = 0, blankItems = new Set();
  for (const st of cls.students) for (const it of sh.items.filter(i => !sh.groups || !i.group || !st.group || i.group === st.group)){ const v = (cls.scores[st.id]||{})[it.id]; if (v === undefined || v === '' || v === null){ blanks++; blankItems.add(it.name); } }
  return {n: cls.students.length, done: totals.length, avg, max: totals.length ? Math.max(...totals) : null, min: totals.length ? Math.min(...totals) : null, low: totals.filter(t => t < T/2).length, blanks, blankItems:[...blankItems]};
}

/* ============ storage ============ */
let DB = null, BASE = null, saveTimer = null, lsTimer = null, saving = false;
const dirty = new Set();
function lsLoad(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch { return null; } }
function lsSave(){ try { localStorage.setItem(LS_KEY, JSON.stringify({sheets:S.sheets, settings:S.settings})); } catch {} }
function uiSave(){ try { localStorage.setItem(LS_UI, JSON.stringify({curId:S.curId, tab:S.tab, classId:S.classId})); } catch {} }
function uiLoad(){ try { return JSON.parse(localStorage.getItem(LS_UI) || 'null'); } catch { return null; } }
function setStatus(s, msg){
  const el = $('#status'); if (!el) return;
  const text = {
    saved: DB ? '已儲存到你的帳戶' : '已儲存在這個瀏覽器',
    pending: '有未儲存的修改…', saving: '儲存中…',
    error: msg || '未能儲存，稍後會再試',
    local: '已儲存在這個瀏覽器'
  }[s] || '';
  el.dataset.s = s; el.querySelector('span').textContent = text;
}
function touch(sh){
  if (sh){ sh.updatedAt = Date.now(); dirty.add(sh.id); }
  clearTimeout(lsTimer); lsTimer = setTimeout(lsSave, 250);
  setStatus('pending');
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 900);
}
async function flush(){
  if (!DB){ dirty.clear(); lsSave(); setStatus('saved'); return; }
  if (saving){ clearTimeout(saveTimer); saveTimer = setTimeout(flush, 600); return; }
  saving = true; setStatus('saving');
  let failed = null;
  while (dirty.size){
    const id = dirty.values().next().value; dirty.delete(id);
    const sh = S.sheets.find(s => s.id === id); if (!sh) continue;
    const stamp = sh.updatedAt;
    const body = clone(sh); delete body.syncedAt;
    try { await DB.doc(`${BASE}/ms_${id}`).set(body); sh.syncedAt = stamp; }
    catch (e){ dirty.add(id); failed = e; break; }
  }
  saving = false; lsSave();
  if (failed){
    const code = failed && failed.code;
    if (code === 'quota_exceeded') setStatus('error', '儲存空間已滿，請刪除舊分紙');
    else setStatus('error');
    if (code === 'unavailable' || code === 'resource_exhausted' || !code){ clearTimeout(saveTimer); saveTimer = setTimeout(flush, 5000); }
  } else setStatus('saved');
}
async function saveSettings(){
  lsSave();
  if (DB){ try { await DB.doc(`${BASE}/settings`).set({settings: S.settings}); } catch {} }
}
async function removeSheet(id){
  S.sheets = S.sheets.filter(s => s.id !== id); dirty.delete(id);
  if (S.curId === id){ S.curId = S.sheets[0]?.id || null; S.classId = null; }
  lsSave(); uiSave();
  if (DB){ try { await DB.doc(`${BASE}/ms_${id}`).delete(); } catch (e){ toast('雲端刪除失敗，請稍後再試'); } }
}
async function initCloud(){
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const base = `data/users/${id}`;
    const snap = await db.collection(base).get();
    const remote = {}; let rset = null;
    snap.docs.forEach(d => { const v = d.data(); if (!v) return; if (d.id === 'settings') rset = v.settings; else if (d.id.startsWith('ms_') && v.id) remote[v.id] = clone(v); });
    const merged = {...remote}; const up = [];
    for (const s of S.sheets){
      const r = remote[s.id];
      if (r){ if ((s.updatedAt||0) > (r.updatedAt||0)){ merged[s.id] = s; up.push(s.id); } }
      else if (!s.syncedAt){ merged[s.id] = s; up.push(s.id); }   // never synced: keep and upload
      /* else: was synced before but now gone from the account → deleted on another device */
    }
    DB = db; BASE = base; S.storage = 'cloud';
    S.sheets = Object.values(merged).sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
    for (const s of S.sheets) if (remote[s.id] && !up.includes(s.id)) s.syncedAt = s.updatedAt;
    if (rset) S.settings = {...S.settings, ...rset};
    if (!S.sheets.find(s => s.id === S.curId)) S.curId = S.sheets[0]?.id || null;
    lsSave(); renderAll();
    if (up.length){ up.forEach(i => dirty.add(i)); flush(); } else setStatus('saved');
  } catch (e){ console.warn('cloud init failed', e); }
}

/* ============ downloads ============ */
async function saveFile(filename, blob){
  let dl = null;
  try { dl = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('downloads') : null; } catch {}
  if (dl){
    try { await dl.save({filename, data: blob}); toast('已下載：' + filename); }
    catch (e){ toast(e && e.code === 'declined' ? '已取消下載' : '未能下載（' + ((e && (e.message || e.code)) || '未知原因') + '）'); }
    return;
  }
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

/* ============ zip (store) + xlsx writer ============ */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files){
  const enc = new TextEncoder(); const parts = [], cen = []; let off = 0;
  for (const f of files){
    const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,0,true); lh.setUint16(12,33,true); lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true);
    lh.setUint32(22,data.length,true); lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(lh.buffer, name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,33,true); ch.setUint32(16,crc,true);
    ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,name.length,true);
    ch.setUint16(30,0,true); ch.setUint16(32,0,true); ch.setUint16(34,0,true); ch.setUint16(36,0,true);
    ch.setUint32(38,0,true); ch.setUint32(42,off,true);
    cen.push(ch.buffer, name);
    off += 30 + name.length + data.length;
  }
  const cenSize = cen.reduce((a,b) => a + b.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,cenSize,true); end.setUint32(16,off,true);
  return new Blob([...parts, ...cen, end.buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function colName(c){ let s = ''; while (c > 0){ const m = (c-1) % 26; s = String.fromCharCode(65+m) + s; c = Math.floor((c-1)/26); } return s; }
const A1 = (r, c) => colName(c) + r;
const xesc = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
class XSheet{
  constructor(name){ this.name = name; this.rows = new Map(); this.merges = []; this.widths = {}; this.heights = {}; this.freeze = null; this.printRows = null; this.page = {orient:'landscape', fitH:0, area:null}; this.validations = []; this.protect = false; }
  set(r, c, v, s = 0, f = null){ if (!this.rows.has(r)) this.rows.set(r, new Map()); this.rows.get(r).set(c, {v, s, f}); }
  merge(r1, c1, r2, c2, s){ if (s !== undefined) for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) if (!(this.rows.get(r)?.has(c))) this.set(r, c, null, s); if (r1 !== r2 || c1 !== c2) this.merges.push(`${A1(r1,c1)}:${A1(r2,c2)}`); }
  xml(){
    let o = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">';
    o += '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><sheetViews><sheetView workbookViewId="0"' + (this.freeze ? '' : ' tabSelected="0"') + '>';
    if (this.freeze){ const {x, y} = this.freeze; o += `<pane${x?` xSplit="${x}"`:''}${y?` ySplit="${y}"`:''} topLeftCell="${A1(y+1, x+1)}" activePane="${x && y ? 'bottomRight' : (y ? 'bottomLeft' : 'topRight')}" state="frozen"/>`; }
    o += '</sheetView></sheetViews><sheetFormatPr defaultRowHeight="18"/>';
    const wk = Object.keys(this.widths).map(Number).sort((a,b) => a-b);
    if (wk.length){ o += '<cols>' + wk.map(c => `<col min="${c}" max="${c}" width="${this.widths[c]}" customWidth="1"/>`).join('') + '</cols>'; }
    o += '<sheetData>';
    for (const r of [...this.rows.keys()].sort((a,b) => a-b)){
      const cells = this.rows.get(r); const h = this.heights[r];

function formulaParts(sh){
  const items = orderedItems(sh), T = num(sh.calc.total), d = +sh.calc.decimals;
  const term = it => num(it.weight) === num(it.full) || sh.calc.mode !== 'item' && !it.bonus ? esc(it.name) : `${esc(it.name)} <span class="op">÷</span> ${fmtN(num(it.full))} <span class="op">×</span> ${fmtN(num(it.weight))}`;
  const bonus = items.filter(i => i.bonus);
  const tail = `${sh.calc.cap ? `，最多 ${T} 分` : ''}，取 ${d} 位小數`;
  return {items, T, d, term, bonus, tail};
}
function formulaHTML(sh){
  const {items, T, term, bonus, tail} = formulaParts(sh);
  const bonusHTML = bonus.length ? ' <span class="op">＋</span> ' + bonus.map(it => `<span class="term bonus">${esc(it.name)} <span class="op">÷</span> ${fmtN(num(it.full))} <span class="op">×</span> ${fmtN(num(it.weight))}</span>`).join(' <span class="op">＋</span> ') : '';
  if (sh.calc.mode === 'item'){
    const nb = items.filter(i => !i.bonus); if (!nb.length) return '<span class="muted">先在「② 評核項目」加入項目。</span>';
    const W = sumWeights(sh, sh.groups ? '上' : undefined);
    const sumPart = nb.map(it => `<span class="term">${term(it)}${sh.groups && it.group ? `<span class="muted">（${GROUP_NAME[it.group]}）</span>` : ''}</span>`).join(' <span class="op">＋</span> ');
    const scale = Math.abs(W - T) < 1e-9 ? '' : ` <span class="op">÷</span> ${fmtN(W)} <span class="op">×</span> ${T}`;
    return `<b>學期總分</b> <span class="op">＝</span> （${sumPart}）${scale}${bonusHTML}<br><span class="muted">${tail.slice(1)}${sh.groups && nb.some(i => i.group) ? '；每位學生只計自己組別（上半班／下半班）的項目' : ''}</span>`;
  }
  const lines = [];
  const used = sh.categories.filter(cat => items.some(i => !i.bonus && i.catId === cat.id));
  if (!used.length) return '<span class="muted">先在「② 評核項目」加入項目。</span>';
  for (const cat of used){
    const its = items.filter(i => !i.bonus && i.catId === cat.id);
    const fullSum = its.reduce((a,i) => a + num(i.full), 0);
    const inner = sh.calc.catMethod === 'avg'
      ? `平均（${its.map(i => `<span class="term">${esc(i.name)} <span class="op">÷</span> ${fmtN(num(i.full))}</span>`).join('、')}）`
      : `（${its.map(i => `<span class="term">${esc(i.name)}</span>`).join(' <span class="op">＋</span> ')}） <span class="op">÷</span> ${fmtN(fullSum)}`;
    lines.push(`<b>${esc(cat.name)}</b> <span class="op">＝</span> ${inner} <span class="op">×</span> ${fmtN(num(cat.weight))}`);
  }
  const W = used.reduce((a,c) => a + num(c.weight), 0);
  const scale = Math.abs(W - T) < 1e-9 ? '' : ` <span class="op">÷</span> ${fmtN(W)} <span class="op">×</span> ${T}`;
  lines.push(`<b>學期總分</b> <span class="op">＝</span> （${used.map(c => esc(c.name)).join(' <span class="op">＋</span> ')}）${scale}${bonusHTML}<br><span class="muted">${tail.slice(1)}</span>`);
  return lines.join('<br>');
}
function formulaPlain(sh){
  const div = document.createElement('div');
  div.innerHTML = formulaHTML(sh).replace(/<br>/g, '\n');
  const lines = div.textContent.split('\n').map(s => s.replace(/\s+/g, ' ').trim()).filter(Boolean);
  lines.push('缺 = 缺交（當 0 分）；免 = 豁免（該項不計入）；空白 = ' + (sh.calc.blank === 'zero' ? '當 0 分' : '不計入'));
  return lines;
}

function bindDrop(){
  const d = $('#drop'); if (!d) return;
  d.addEventListener('dragover', e => { e.preventDefault(); d.classList.add('over'); });
  d.addEventListener('dragleave', () => d.classList.remove('over'));
  d.addEventListener('drop', e => { e.preventDefault(); d.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) handleRosterFile(f); });
}
async function handleRosterFile(file){
  try {
    let found = [];
    if (isElective(cur())){
      const sheets = /\.(csv|txt)$/i.test(file.name) ? [{name: file.name.replace(/\.[^.]+$/, ''), grid: parseDelimited(await file.text())}] : await readXlsx(await file.arrayBuffer());
      const st = electiveRoster(sheets.filter(s0 => s0.grid.some(r => r && r.length)));
      if (!st.length){ toast('找不到名單：請確認有「班別」、「學號」及「姓名」欄'); return; }
      const c0 = curClass(cur());
      S.importPreview = [{name: c0 ? c0.name : `${FORM_ZH[cur().form] || ''} ${SUBJ[cur().subject].name}`.trim(), students: st, include: true}]; S.importPreview.source = file.name; renderTab(); return;
    }
    if (/\.(csv|txt)$/i.test(file.name)){
      const det = detectRoster(parseDelimited(await file.text()));
      if (det) found.push({name: guessClassName(file.name.replace(/\.[^.]+$/, '')), students: det.students, include: true});
    } else if (/\.xls$/i.test(file.name)){
      toast('舊式 .xls 檔未能讀取，請在 Excel 另存為 .xlsx 再匯入'); return;
    } else {
      const sheets = await readXlsx(await file.arrayBuffer());
      for (const s of sheets){ const det = detectRoster(s.grid); if (det) found.push({name: guessClassName(s.name), students: det.students, include: true}); }
    }
    if (!found.length){ toast('找不到學生名單：請確認有「班號」一欄（1、2、3…）及姓名'); return; }
    S.importPreview = found; S.importPreview.source = file.name; renderTab();
  } catch (e){ console.error(e); toast('讀取檔案失敗：' + (e.message || e)); }
}

        return `<tr class="cat-band"><td colspan="${sh.groups ? 8 : 7}" class="c${k % 8}"><div class="row" style="justify-content:space-between"><span>${esc(cat.name)} <span class="muted" style="font-weight:400">・${its.length} 項${modeItem ? (sh.groups && its.some(i => i.group) ? `・折算 ${GROUPS.map(g => `${g} ${fmtN(its.filter(i => !i.bonus && (!i.group || i.group === g)).reduce((a, i) => a + num(i.weight), 0))}`).join('／')}` : `・折算 ${fmtN(sub)}`) : `・比重 ${fmtN(num(cat.weight))}%`}</span></span><button class="btn sm" data-act="itemAdd" data-cat="${cat.id}">＋ 在「${esc(cat.name)}」加項目</button></div></td></tr>` +
          its.map(it => `<tr data-iid="${it.id}">
            <td><input class="inp" data-f="item" data-k="name" value="${esc(it.name)}" aria-label="項目名稱"></td>
            <td><input class="inp" data-f="item" data-k="content" value="${esc(it.content)}" placeholder="例如：第一章 習作 1-10 題" aria-label="內容"></td>
            <td><input class="inp" data-f="item" data-k="date" value="${esc(it.date)}" placeholder="10/9" aria-label="日期"></td>
            ${sh.groups ? `<td><select class="inp" data-f="item" data-k="group" aria-label="適用組別" style="width:auto">${[['','全班'],['上','上半班'],['下','下半班']].map(([v, l]) => `<option value="${v}"${(it.group || '') === v ? ' selected' : ''}>${l}</option>`).join('')}</select></td>` : ''}
            <td><input class="inp num" data-f="item" data-k="full" value="${fmtN(num(it.full))}" inputmode="decimal" aria-label="滿分"></td>
            <td>${(modeItem || it.bonus) ? `<input class="inp num" data-f="item" data-k="weight" value="${fmtN(num(it.weight))}" inputmode="decimal" aria-label="${it.bonus ? '加分上限' : '折算分'}">` : '<span class="muted">—</span>'}</td>
            <td style="text-align:center"><input type="checkbox" data-f="item" data-k="bonus" ${it.bonus ? 'checked' : ''} aria-label="加分項" style="accent-color:var(--accent);width:16px;height:16px"></td>
            <td class="w-act"><select class="inp" data-f="item" data-k="catId" aria-label="移到類別" style="width:auto;padding:3px 4px;font-size:12px">${sh.categories.map(c => `<option value="${c.id}"${c.id === it.catId ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
              <button class="btn icon ghost" data-act="itemUp" data-id="${it.id}" aria-label="上移">↑</button><button class="btn icon ghost" data-act="itemDel" data-id="${it.id}" aria-label="刪除項目">✕</button></td></tr>`).join('');
      }).join('')}</tbody></table></div>` : '<p class="hint">請先加入類別。</p>'}
  </section>`;
}

/* ---- tab 3 calc ---- */
function calcTab(sh){
  const c = sh.calc; const used = sh.categories.filter(cat => sh.items.some(i => !i.bonus && i.catId === cat.id));
  const wsum = used.reduce((a,x) => a + num(x.weight), 0);
  const cls = curClass(sh); const st = cls && cls.students.find(s => s.id === S.exStu) || (cls && cls.students[0]);
  return `
  <section class="card">
    <h3>計分方式</h3>
    <div class="modes">
      <label class="mode"><input type="radio" name="mode" data-f="calc" data-k="mode" value="item" ${c.mode === 'item' ? 'checked' : ''}><span><b>按項目折算</b><small>每個項目先折算成指定分數，全部加起來，再按比例變成學期總分。舊電腦分紙（默書 × 4.4，÷ 219 × 50）和 DT 分紙（各部份折算後 ÷ 2）都是這種。</small></span></label>
      <label class="mode"><input type="radio" name="mode" data-f="calc" data-k="mode" value="category" ${c.mode === 'category' ? 'checked' : ''}><span><b>按類別比重</b><small>每個類別佔一個百分比，例如功課 30%、測驗 50%、課堂表現 20%。類別內的項目先合併，項目多少不影響比重。</small></span></label>
    </div>
    <div class="form2" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
      <div class="field"><label for="cTotal">學期總分（滿分）</label><input class="inp num" id="cTotal" data-f="calc" data-k="total" value="${num(c.total)}" inputmode="decimal"></div>
      <div class="field"><label for="cDec">小數位</label><select class="inp" id="cDec" data-f="calc" data-k="decimals">${[0,1,2].map(n => `<option value="${n}"${+c.decimals === n ? ' selected' : ''}>${n} 位</option>`).join('')}</select></div>
      <div class="field"><label for="cBlank">空白的分數</label><select class="inp" id="cBlank" data-f="calc" data-k="blank"><option value="zero"${c.blank === 'zero' ? ' selected' : ''}>當 0 分</option><option value="skip"${c.blank === 'skip' ? ' selected' : ''}>不計入（學期中途用）</option></select></div>
      ${c.mode === 'category' ? `<div class="field"><label for="cMeth">類別內合併方法</label><select class="inp" id="cMeth" data-f="calc" data-k="catMethod"><option value="sum"${c.catMethod === 'sum' ? ' selected' : ''}>合計分數 ÷ 合計滿分</option><option value="avg"${c.catMethod === 'avg' ? ' selected' : ''}>各項百分比平均</option></select></div>` : ''}
      <div class="field" style="justify-content:flex-end"><label class="check"><input type="checkbox" data-f="calc" data-k="cap" ${c.cap ? 'checked' : ''}> 總分不可超過滿分</label></div>
    </div>
    ${c.mode === 'category' ? `<div class="sub"><div class="row" style="justify-content:space-between"><h4>類別比重</h4><span class="pill ${Math.abs(wsum - 100) < 1e-6 ? 'ok' : 'warn'}">合計 ${fmtN(wsum)}%${Math.abs(wsum - 100) < 1e-6 ? '' : '（會按比例換算）'}</span></div>
      <div class="row">${used.map(cat => `<div class="field" style="width:130px"><label>${esc(cat.name)}</label><div class="row" style="flex-wrap:nowrap;gap:4px"><input class="inp num" data-f="catWeight" data-id="${cat.id}" value="${fmtN(num(cat.weight))}" inputmode="decimal" aria-label="${esc(cat.name)} 比重"><span>%</span></div></div>`).join('')}
      <button class="btn sm" data-act="autoWeights" style="align-self:flex-end">按項目滿分自動分配</button></div></div>` : ''}
  </section>
  <section class="card">
    <h3>公式</h3>
    <div class="formula">${formulaHTML(sh)}</div>
    <p class="hint">輸入分數時：<code class="mono">缺</code> 代表缺交，當 0 分；<code class="mono">免</code> 代表豁免，該項目不計入這位學生的總分（其餘項目按比例補足）。</p>
  </section>
  ${st ? `<section class="card">
    <div class="card-head"><h3>用學生驗算</h3>
      <div class="row">${classChips(sh, 'exClass')}<select class="inp" data-f="exStu" aria-label="選擇學生" style="width:auto">${cls.students.map(s => `<option value="${s.id}"${s.id === st.id ? ' selected' : ''}>${esc(s.no)} ${esc(stuName(s))}</option>`).join('')}</select></div></div>
    ${workedExample(sh, cls, st)}
  </section>` : ''}`;
}
function workedExample(sh, cls, st){
  const sc = cls.scores[st.id] || {}; const items = orderedItems(sh); const res = computeStudent(sh, sc, st.group); const c = sh.calc; const T = num(c.total);
  const rows = items.map(it => {
    const v = sc[it.id]; const s = itemState(sh, v);
    let contrib = '—';
    if (s.inc && num(it.full) > 0){
      if (it.bonus) contrib = '+' + fmtN(s.n / num(it.full) * num(it.weight)) + '（加分）';
      else if (c.mode === 'item') contrib = fmtN(s.n / num(it.full) * num(it.weight)) + ' / ' + fmtN(num(it.weight));
      else contrib = fmtN(s.n / num(it.full) * 100) + '%';
    } else if (!s.inc) contrib = '不計入';
    const cat = sh.categories.find(x => x.id === it.catId);
    return `<tr><td>${esc(cat ? cat.name : '')}</td><td>${esc(it.name)}</td><td class="num">${v === undefined || v === '' ? '<span class="muted">空白</span>' : esc(v)}</td><td class="num">${fmtN(num(it.full))}</td><td class="num">${contrib}</td></tr>`;
  }).join('');
  const catRows = c.mode === 'category' ? sh.categories.filter(cat => cat.id in res.cats).map(cat => `<span class="pill">${esc(cat.name)}：${res.cats[cat.id] === null ? '不計入' : fmtN(res.cats[cat.id]) + ' / ' + fmtN(num(cat.weight))}</span>`).join(' ') : '';
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>類別</th><th>項目</th><th>得分</th><th>滿分</th><th>${c.mode === 'item' ? '折算後' : '百分比'}</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${catRows ? `<div class="row">${catRows}</div>` : ''}
    <div class="sumline"><span>${esc(stuName(st))} 的學期總分</span><b style="font-size:20px">${fmt(res.total, +c.decimals)}</b><span>/ ${T}</span></div>`;
}

/* ---- tab 4 scores ---- */
function gridView(sh, cls){
  const g = sh.groups ? (S.grpView || '') : '';
  const items = orderedItems(sh).filter(it => !g || !it.group || it.group === g);
  const studs = cls.students.filter(st => !g || st.group === g || !st.group);
  const catsUsed = sh.calc.mode === 'category' ? sh.categories.filter(cat => items.some(i => !i.bonus && i.catId === cat.id)) : [];
  return {g, items, studs, catsUsed};
}
function scoresTab(sh){
  const cls = curClass(sh);
  if (!sh.classes.length) return `<section class="card"><h3>輸入分數</h3><p class="hint">先在「① 學生名單」加入班別和學生。</p><div><button class="btn" data-act="tab" data-tab="roster">前往學生名單</button></div></section>`;
  if (!sh.items.length) return `<section class="card"><h3>輸入分數</h3><p class="hint">先在「② 評核項目」加入項目。</p><div><button class="btn" data-act="tab" data-tab="items">前往評核項目</button></div></section>`;
  const {items, studs, catsUsed, g: gv} = gridView(sh, cls); const c = sh.calc; const T = num(c.total);
  // category spans
  const spans = []; let i = 0;
  while (i < items.length){ const cid = items[i].catId; let j = i; while (j + 1 < items.length && items[j+1].catId === cid) j++; spans.push({cat: sh.categories.find(x => x.id === cid), n: items.slice(i, j + 1).reduce((a, it) => a + (rawOf(sh, it) ? 3 : 1), 0)}); i = j + 1; }
  const head1 = `<tr><th class="stick1" rowspan="3">${isElective(sh) ? '班別<br>學號' : '班號'}</th><th class="stick2" rowspan="3" style="text-align:left">姓名</th>
    ${spans.map(s => `<th colspan="${s.n}" class="c${catIndex(sh, s.cat?.id)}">${esc(s.cat ? s.cat.name : '')}</th>`).join('')}
    ${catsUsed.length ? `<th colspan="${catsUsed.length}">類別得分</th>` : ''}<th class="tot" rowspan="3">總分<br><span class="num" style="font-weight:400;font-size:11.5px">/ ${T}</span></th></tr>`;
  const head2 = `<tr>${items.map(it => `${rawOf(sh, it) ? `<th class="c${catIndex(sh, it.catId)} rawh"><span class="iname">分數</span></th><th class="c${catIndex(sh, it.catId)} rawh"><span class="iname">${esc(rawOf(sh, it).unit || 'WPM')}</span></th>` : ''}<th class="c${catIndex(sh, it.catId)}" title="${esc([it.content, it.date].filter(Boolean).join('｜'))}"><span class="iname">${esc(it.name)}${it.bonus ? ' <span class="pill">加分</span>' : ''}${rawOf(sh, it) ? '<br>換算得分' : ''}</span></th>`).join('')}
    ${catsUsed.map(cat => `<th><span class="iname">${esc(cat.name)}</span></th>`).join('')}</tr>`;
  const head3 = `<tr>${items.map(it => `${rawOf(sh, it) ? '<th class="rawh"><span class="ifull">原始</span></th><th class="rawh"><span class="ifull">原始</span></th>' : ''}<th><span class="ifull">/${fmtN(num(it.full))}${c.mode === 'item' && !it.bonus && num(it.weight) !== num(it.full) ? `→${fmtN(num(it.weight))}` : ''}${it.bonus ? `→+${fmtN(num(it.weight))}` : ''}<button class="btn" data-act="colTools" data-id="${it.id}" aria-label="${esc(it.name)} 整欄工具" title="整欄工具">⋯</button></span></th>`).join('')}
    ${catsUsed.map(cat => `<th><span class="ifull">${fmtN(num(cat.weight))}%</span></th>`).join('')}</tr>`;
  const body = studs.map((st, r) => {
    const sc = cls.scores[st.id] || {}; const res = computeStudent(sh, sc, st.group);
    return `<tr data-sid="${st.id}"><td class="no stick1">${isElective(sh) && st.cls ? `<small style="display:block;line-height:1.1">${esc(st.cls)}</small>` : ''}${esc(st.no)}</td><td class="nm stick2">${sh.groups && st.group ? `<span class="pill grp">${st.group}</span> ` : ''}${esc(st.zh || st.en)}${st.zh && st.en ? `<small>${esc(st.en)}</small>` : ''}</td>
      ${items.map((it, k) => { const v = sc[it.id]; const cls2 = scoreClass(v, it); const ri = rawOf(sh, it); const rd = ri ? (ri.data[st.id] || {}) : null; if (sh.groups && it.group && st.group && it.group !== st.group) return `${ri ? '<td class="rawv"></td><td class="rawv"></td>' : ''}<td class="na" title="${GROUP_NAME[st.group]}不做這項">—</td>`;
        return `${ri ? `<td class="rawv">${rd.score ?? ''}</td><td class="rawv">${rd.wpm ?? ''}</td>` : ''}<td><input class="sc${cls2}" data-r="${r}" data-c="${k}" data-iid="${it.id}" value="${v === undefined || v === null ? '' : esc(v)}" inputmode="decimal" autocomplete="off" aria-label="${esc(stuName(st))} ${esc(it.name)}"></td>`; }).join('')}
      ${catsUsed.map(cat => `<td class="catv" data-cat="${cat.id}">${res.cats[cat.id] === undefined || res.cats[cat.id] === null ? '—' : fmt(res.cats[cat.id], 1)}</td>`).join('')}
      <td class="tot${res.total !== null && res.total < T/2 ? ' low' : ''}">${fmt(res.total, +c.decimals)}</td></tr>`;
  }).join('');
  return `
  <section class="card">
    <div class="card-head"><div class="row">${classChips(sh)}${sh.groups ? `<div class="chips" role="group" aria-label="組別">${[['','全班'],['上','上半班'],['下','下半班']].map(([v, l]) => `<button class="chip" data-act="grpView" data-g="${v}" aria-pressed="${gv === v}">${l}</button>`).join('')}</div>` : ''}</div>
      <div class="row"><button class="btn sm" data-act="copyTotals">複製總分（可貼到 Excel）</button><button class="btn sm primary" data-act="tab" data-tab="export">匯出 Excel</button></div></div>
    <div class="legend"><span>輸入後按 <code>Enter</code> 移到下一位學生，方向鍵移動</span><span><code>缺</code> 缺交，當 0 分</span><span><code>免</code> 豁免，不計入</span><span>可以從 Excel 複製一整欄分數，點第一格後貼上</span></div>
    ${studs.length ? `<div class="grid-wrap"><table class="g" id="grid"><thead>${head1}${head2}${head3}</thead><tbody>${body}</tbody><tfoot>${footRow(sh, cls, items, catsUsed, studs)}</tfoot></table></div>` : `<p class="hint">${esc(cls.name)} 還沒有學生。</p>`}
  </section>`;
}
function scoreClass(v, it){
  if (v === '缺' || v === '免') return ' txt';
  if (typeof v === 'number' && v > num(it.full)) return ' over';
  return '';
}
function footRow(sh, cls, items, catsUsed, studs){
  studs = studs || cls.students;
  const avg = arr => { const v = arr.filter(x => typeof x === 'number' && Number.isFinite(x)); return v.length ? v.reduce((a,b) => a+b, 0) / v.length : null; };
  const results = studs.map(st => computeStudent(sh, cls.scores[st.id], st.group));
  return `<tr><td class="stick1"></td><td class="stick2" style="text-align:left;padding-left:10px">${sh.groups && S.grpView ? GROUP_NAME[S.grpView] + '平均' : '全班平均'}</td>
    ${items.map(it => { const ri = rawOf(sh, it); return `${ri ? `<td>${fmt(avg(studs.map(st => (ri.data[st.id] || {}).score)), 1)}</td><td>${fmt(avg(studs.map(st => (ri.data[st.id] || {}).wpm)), 1)}</td>` : ''}<td>${fmt(avg(studs.map(st => (cls.scores[st.id]||{})[it.id])), 1)}</td>`; }).join('')}
    ${catsUsed.map(cat => `<td>${fmt(avg(results.map(r => r.cats[cat.id])), 1)}</td>`).join('')}
    <td class="tot">${fmt(avg(results.map(r => r.total)), +sh.calc.decimals)}</td></tr>`;
}
function refreshRow(sh, cls, sid){
  const tr = document.querySelector(`#grid tr[data-sid="${sid}"]`); if (!tr) return;
  const res = computeStudent(sh, cls.scores[sid], (cls.students.find(x => x.id === sid) || {}).group); const T = num(sh.calc.total);
  const tot = tr.querySelector('td.tot'); tot.textContent = fmt(res.total, +sh.calc.decimals); tot.classList.toggle('low', res.total !== null && res.total < T/2);
  tr.querySelectorAll('td.catv').forEach(td => { const v = res.cats[td.dataset.cat]; td.textContent = v === undefined || v === null ? '—' : fmt(v, 1); });
  const gv = gridView(sh, cls);
  const tf = document.querySelector('#grid tfoot'); if (tf) tf.innerHTML = footRow(sh, cls, gv.items, gv.catsUsed, gv.studs);
}
function normScore(raw){
  const s = String(raw).trim();
  if (s === '') return {ok:true, v:null};
  if (/^(缺|abs?|a)$/i.test(s)) return {ok:true, v:'缺'};
  if (/^(免|ex|e|x)$/i.test(s)) return {ok:true, v:'免'};
  if (/^(\d+\.?\d*|\.\d+)$/.test(s)) return {ok:true, v: Number(s)};
  return {ok:false};
}
function setScore(sh, cls, sid, iid, raw){
  const n = normScore(raw); if (!n.ok) return false;
  cls.scores[sid] ||= {};
  if (n.v === null) delete cls.scores[sid][iid]; else cls.scores[sid][iid] = n.v;
  return true;
}

/* ---- tab 5 export ---- */
function exportTab(sh){
  const T = num(sh.calc.total); const d = +sh.calc.decimals;
  const stats = sh.classes.map(c => ({c, s: classStats(sh, c)}));
  const all = sh.classes.flatMap(c => c.students.map(st => computeStudent(sh, c.scores[st.id], st.group).total)).filter(x => x !== null);
  const avgAll = all.length ? all.reduce((a,b) => a+b, 0) / all.length : null;
  const blanks = stats.reduce((a,x) => a + x.s.blanks, 0);
  return `
  <section class="card">
    <h3>總覽</h3>
    <div class="stats">
      <div class="stat"><small>學生人數</small><b>${sh.classes.reduce((a,c) => a + c.students.length, 0)}</b></div>
      <div class="stat"><small>全級平均（/${T}）</small><b>${fmt(avgAll, 1)}</b></div>
      <div class="stat"><small>低於一半（${fmtN(T/2)} 分）</small><b>${all.filter(t => t < T/2).length}</b></div>
      <div class="stat"><small>未輸入的空格</small><b style="color:${blanks ? 'var(--warn)' : 'var(--ok)'}">${blanks}</b></div>
    </div>
    ${sh.classes.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>班別</th><th>人數</th><th>平均</th><th>最高</th><th>最低</th><th>低於一半</th><th>空格</th></tr></thead><tbody>
      ${stats.map(({c, s}) => `<tr><td><b>${esc(c.name)}</b></td><td class="num">${s.n}</td><td class="num">${fmt(s.avg, 1)}</td><td class="num">${fmt(s.max, d)}</td><td class="num">${fmt(s.min, d)}</td><td class="num">${s.low}</td>
        <td>${s.blanks ? `<span class="pill warn" title="${esc(s.blankItems.join('、'))}">${s.blanks} 格・${esc(s.blankItems.slice(0,3).join('、'))}${s.blankItems.length > 3 ? '…' : ''}</span>` : '<span class="pill ok">齊全</span>'}</td></tr>`).join('')}
    </tbody></table></div>` : ''}
    ${blanks && sh.calc.blank === 'zero' ? '<p class="hint">空格目前當 0 分計算。若分數未收齊，可在「③ 計分方式」改為「不計入」。</p>' : ''}
  </section>
  <section class="card">
    <h3>匯出 Excel 分紙</h3>
    <p class="hint">每班一個工作表，每班剛好印一張 A4（連學生簽署欄）。總分欄是 Excel 公式：在 Excel 改分數、輸入「缺」或「免」都會自動重算。另附「評核項目」工作表列出每項內容和計分方法。</p>
    <div class="modes">
      <label class="mode"><input type="radio" name="expKind" id="expFilled" value="filled" checked><span><b>連分數</b><small>匯出這裏已輸入的分數，用來存檔或印出簽分。</small></span></label>
      <label class="mode"><input type="radio" name="expKind" id="expBlank" value="blank"><span><b>空白分紙（給同事填寫）</b><small>只有學生名單、滿分、折算分和公式，分數留空。同事在 Excel 填分，總分自動計好，可直接影印簽分。沒有名單的班會預留空行。</small></span></label>

  autoWeights(){ const sh = cur(); autoCatWeights(sh.categories, sh.items); touch(sh); renderTab(); },
  colTools(el){ const sh = cur(); const it = sh.items.find(i => i.id === el.dataset.id); const cls = curClass(sh);
    openModal(`<h2>${esc(it.name)}</h2><p class="hint">${esc(cls.name)}・滿分 ${fmtN(num(it.full))}${it.content ? '・' + esc(it.content) : ''}</p>
      <div class="row"><button class="btn" data-act="colFill" data-id="${it.id}" data-v="full">空格填滿分</button><button class="btn" data-act="colFill" data-id="${it.id}" data-v="0">空格填 0</button><button class="btn" data-act="colFill" data-id="${it.id}" data-v="免">全班豁免</button><button class="btn danger" data-act="colFill" data-id="${it.id}" data-v="clear">清除整欄</button></div>
      <div class="foot"><button class="btn" data-act="close">關閉</button></div>`); },
  colFill(el){ const sh = cur(); const cls = curClass(sh); const it = sh.items.find(i => i.id === el.dataset.id); const v = el.dataset.v;
    for (const st of cls.students){ if (sh.groups && it.group && st.group && it.group !== st.group) continue; cls.scores[st.id] ||= {}; const cur0 = cls.scores[st.id][it.id]; const empty = cur0 === undefined || cur0 === '' || cur0 === null;
      if (v === 'clear') delete cls.scores[st.id][it.id]; else if (v === '免') cls.scores[st.id][it.id] = '免'; else if (empty) cls.scores[st.id][it.id] = v === 'full' ? num(it.full) : 0; }
    closeModal(); touch(sh); renderTab(); },
  async copyTotals(){ const sh = cur(); const cls = curClass(sh);
    const el = isElective(sh); const text = [(el ? '班別\t學號' : '班號') + '\t中文姓名\t英文姓名\t總分'].concat(cls.students.map(st => `${el ? (st.cls || '') + '\t' : ''}${st.no}\t${st.zh}\t${st.en}\t${fmt(computeStudent(sh, cls.scores[st.id], st.group).total, +sh.calc.decimals)}`)).join('\n');
    try { await navigator.clipboard.writeText(text); toast(`已複製 ${cls.name} 的總分`); }
    catch { openModal(`<h2>複製總分</h2><p class="hint">全選後按 Ctrl+C 複製。</p><textarea class="inp" id="copyArea" style="min-height:220px">${esc(text)}</textarea><div class="foot"><button class="btn" data-act="close">關閉</button></div>`); const a = $('#copyArea'); a.focus(); a.select(); } },
  exportXlsx(){ const sh = cur(); const ids = [...document.querySelectorAll('[data-exp]')].filter(x => x.checked).map(x => x.dataset.exp);
    if (!ids.length){ toast('請最少選一班'); return; }
    const blank = $('#expBlank').checked; const rows = Math.max(1, Math.min(60, parseInt($('#optRows').value, 10) || 35));
    const blob = exportMarksheet(sh, ids, {sign: $('#optSign').checked, summary: $('#optSummary').checked, protect: $('#optProtect').checked, blank, rows});
    const fn = `${sh.form}_${SUBJ[sh.subject].name}_${sh.year}_${sh.term}_${blank ? '空白分紙' : '分紙'}.xlsx`.replace(/[\\/:*?"<>|\s]+/g, '_');
    saveFile(fn, blob); },
  backup(){ const data = JSON.stringify({app:'marksheet-tool', version:1, exportedAt: new Date().toISOString(), settings: S.settings, sheets: S.sheets}, null, 1);
    saveFile(`分紙備份_${new Date().toISOString().slice(0,10)}.json`, new Blob([data], {type:'application/json'})); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = actions[el.dataset.act]; if (!fn) return;
  if (el.dataset.act === 'overlay' && e.target !== el) return;
  fn(el, e);
});
document.addEventListener('change', async e => {
  const t = e.target; const sh = cur();
  if (t.id === 'tyFile' && t.files[0]){
    try { const f = t.files[0]; const sheets = /\.(csv|txt)$/i.test(f.name) ? [{name: f.name.replace(/\.[^.]+$/, ''), grid: parseDelimited(await f.text())}] : await readXlsx(await f.arrayBuffer()); await tyLoadSheets(sh, sheets.filter(s => s.grid.some(r => r && r.length))); }
    catch (err){ toast('讀取檔案失敗：' + (err.message || err)); }
    t.value = ''; return;
  }
  if (t.id === 'rosterFile' && t.files[0]){ await handleRosterFile(t.files[0]); t.value = ''; return; }
  if (t.id === 'restoreFile' && t.files[0]){
    try { const d = JSON.parse(await t.files[0].text()); if (!Array.isArray(d.sheets)) throw new Error('格式不符');
      let n = 0; for (const s of d.sheets){ if (!s || !s.id || !s.subject) continue; const i = S.sheets.findIndex(x => x.id === s.id); delete s.syncedAt; s.updatedAt = Date.now(); if (i >= 0) S.sheets[i] = s; else S.sheets.push(s); dirty.add(s.id); n++; }
      if (d.settings) S.settings = {...S.settings, ...d.settings};
      if (!S.curId && S.sheets[0]) S.curId = S.sheets[0].id; touch(null); renderAll(); toast(`已還原 ${n} 份分紙`);
    } catch (err){ toast('還原失敗：' + err.message); }
    t.value = ''; return;
  }
  const f = t.dataset.f; if (!f) return;
  if (f === 'school'){ S.settings.school = t.value.trim(); saveSettings(); return; }
  if (!sh) return;
  if (f === 'className'){ const c = curClass(sh); const v = t.value.trim(); if (v){ c.name = v; touch(sh); renderAll(); } return; }
  if (f === 'stu'){ const c = curClass(sh); const st = c.students.find(s => s.id === t.closest('tr').dataset.sid); if (!st) return; let v = t.value.trim(); if (t.dataset.k === 'no' && /^\d+$/.test(v)) v = +v; st[t.dataset.k] = v; touch(sh); renderSide(); return; }
  if (f === 'pvInc'){ S.importPreview[+t.dataset.k].include = t.checked; return; }
  if (f === 'pvName'){ S.importPreview[+t.dataset.k].name = t.value.trim(); renderTab(); return; }
  if (f === 'catName'){ const c = sh.categories.find(x => x.id === t.dataset.id); if (c && t.value.trim()){ c.name = t.value.trim(); touch(sh); renderTab(); } return; }
  if (f === 'catWeight'){ const c = sh.categories.find(x => x.id === t.dataset.id); const v = parseFloat(t.value); if (c && Number.isFinite(v) && v >= 0){ c.weight = v; touch(sh); } renderTab(); return; }
  if (f === 'item'){
    const it = sh.items.find(i => i.id === t.closest('tr').dataset.iid); if (!it) return; const k = t.dataset.k;
    if (k === 'bonus'){ it.bonus = t.checked; if (it.bonus && num(it.weight) === num(it.full)) it.weight = roundTo(num(it.full) / 4, 1); }
    else if (k === 'full' || k === 'weight'){ const v = parseFloat(t.value); if (!Number.isFinite(v) || v < 0 || (k === 'full' && v === 0)){ toast(k === 'full' ? '滿分要大於 0' : '請輸入正數'); renderTab(); return; }
      if (k === 'full' && !it.bonus && num(it.weight) === num(it.full)) it.weight = v; it[k] = v; }
    else it[k] = t.value.trim();
    touch(sh); renderTab(); return;
  }
  if (f === 'calc'){
    const k = t.dataset.k; const c = sh.calc;
    if (k === 'cap') c.cap = t.checked;
    else if (k === 'total'){ const v = parseFloat(t.value); if (Number.isFinite(v) && v > 0) c.total = v; else toast('學期總分要大於 0'); }
    else if (k === 'decimals') c.decimals = +t.value;
    else c[k] = t.value;
    if (k === 'mode' && t.value === 'category'){ const tot = sh.categories.reduce((a,x) => a + num(x.weight), 0); if (!tot) autoCatWeights(sh.categories, sh.items); }
    touch(sh); renderTab(); return;
  }
  if (f === 'elective'){ sh.elective = t.checked; touch(sh); renderAll(); return; }
  if (f === 'groups'){ sh.groups = t.checked; touch(sh); renderTab(); return; }
  if (f === 'tyMan'){
    const ty = tyDefaults(sh); ty.manual ||= {}; const sid = t.dataset.sid; const m = ty.manual[sid] ||= {};
    const v = t.value.trim(); if (v === '') delete m[t.dataset.k]; else { const n = tyNum(v); if (n === null || n < 0){ toast('請輸入數字'); renderTab(); return; } m[t.dataset.k] = n; }
    if (!Object.keys(m).length) delete ty.manual[sid];
    touch(sh); renderTab(); const nk = {score:'wpm', wpm:'acc'}[t.dataset.k]; if (nk) document.querySelector(`[data-f="tyMan"][data-sid="${sid}"][data-k="${nk}"]`)?.focus(); return;
  }
  if (f === 'ty'){
    const ty = tyDefaults(sh); const path = t.dataset.k.split('.'); let o = ty; for (let i = 0; i < path.length - 1; i++) o = o[path[i]]; const last = path[path.length - 1];
    if (path[0] === 'map') o[last] = t.value === '' ? undefined : +t.value;
    else if (t.type === 'checkbox') o[last] = t.checked;
    else if (/^p[123]$/.test(path[0])){ const v = parseFloat(t.value); if (!Number.isFinite(v) || v < 0){ toast('請輸入正數'); renderTab(); return; } o[last] = v; }
    else o[last] = t.value;
    touch(sh); renderTab(); return;
  }
  if (f === 'exStu'){ S.exStu = t.value; renderTab(); return; }
});
/* score grid: live input, keyboard, paste */
document.addEventListener('input', e => {
  const t = e.target; if (!t.classList || !t.classList.contains('sc')) return;
  const sh = cur(); const cls = curClass(sh); const sid = t.closest('tr').dataset.sid; const it = sh.items.find(i => i.id === t.dataset.iid);
  const ok = setScore(sh, cls, sid, it.id, t.value);
  t.classList.toggle('bad', !ok);
  if (ok){ const v = (cls.scores[sid] || {})[it.id]; t.className = 'sc' + scoreClass(v, it); refreshRow(sh, cls, sid); touch(sh); }
});
document.addEventListener('focusout', e => {
  const t = e.target; if (!t.classList || !t.classList.contains('sc')) return;
  const sh = cur(); const cls = curClass(sh); if (!sh || !cls) return; const sid = t.closest('tr')?.dataset.sid; if (!sid) return;
  const v = (cls.scores[sid] || {})[t.dataset.iid]; if (!t.classList.contains('bad')) t.value = v === undefined ? '' : v;
});
document.addEventListener('focusin', e => { const t = e.target; if (t.classList && t.classList.contains('sc')){ t.select(); t._fresh = true; } });
document.addEventListener('mouseup', e => { const t = e.target; if (t.classList && t.classList.contains('sc') && t._fresh){ e.preventDefault(); t._fresh = false; } });
document.addEventListener('keydown', e => { if (e.target && e.target._fresh) e.target._fresh = false; }, true);
function gridCell(r, c){ return document.querySelector(`#grid input.sc[data-r="${r}"][data-c="${c}"]`); }
function gridStep(r, c, dr, dc){ const maxR = document.querySelectorAll('#grid tbody tr').length - 1, maxC = document.querySelectorAll('#grid thead tr:nth-child(3) th').length;
  for (let rr = r + dr, cc = c + dc; rr >= 0 && rr <= maxR && cc >= 0 && cc <= maxC; rr += dr, cc += dc){ const n = gridCell(rr, cc); if (n) return n; } return null; }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modalRoot').innerHTML){ closeModal(); return; }
  const t = e.target; if (!t.classList || !t.classList.contains('sc')) return;
  const r = +t.dataset.r, c = +t.dataset.c; let n = null;
  if (e.key === 'Enter' || e.key === 'ArrowDown') n = gridStep(r, c, e.shiftKey && e.key === 'Enter' ? -1 : 1, 0);
  else if (e.key === 'ArrowUp') n = gridStep(r, c, -1, 0);
  else if (e.key === 'ArrowRight' && t.selectionEnd === t.value.length) n = gridStep(r, c, 0, 1);
  else if (e.key === 'ArrowLeft' && t.selectionStart === 0 && t.selectionEnd === 0 || e.key === 'ArrowLeft' && t.selectionStart === 0 && t.selectionEnd === t.value.length) n = gridStep(r, c, 0, -1);
  if (n){ e.preventDefault(); n.focus(); }
  else if (e.key === 'Enter') e.preventDefault();
});
document.addEventListener('paste', e => {
  const t = e.target; if (!t.classList || !t.classList.contains('sc')) return;
  const text = (e.clipboardData || window.clipboardData).getData('text'); if (!/[\t\n]/.test(text.replace(/\n$/, ''))) return;
  e.preventDefault();
  const sh = cur(); const cls = curClass(sh); const {items, studs} = gridView(sh, cls);
  const rows = text.replace(/\r/g, '').replace(/\n$/, '').split('\n').map(l => l.split('\t'));
  const r0 = +t.dataset.r, c0 = +t.dataset.c; let n = 0, bad = 0;
  rows.forEach((row, i) => row.forEach((v, j) => { const st = studs[r0 + i], it = items[c0 + j]; if (!st || !it || (sh.groups && it.group && st.group && it.group !== st.group)) return; if (setScore(sh, cls, st.id, it.id, v)) n++; else bad++; }));
  touch(sh); renderTab(); gridCell(r0, c0)?.focus();
  toast(`已貼上 ${n} 個分數${bad ? `，${bad} 個無法讀取` : ''}`);
});

/* ============ boot ============ */
(function boot(){
  const saved = lsLoad();
  if (saved){ S.sheets = Array.isArray(saved.sheets) ? saved.sheets : []; S.settings = {...S.settings, ...(saved.settings || {})}; }
  const ui = uiLoad();
  if (ui){ S.curId = ui.curId; S.tab = ui.tab || 'roster'; S.classId = ui.classId; }
  if (!S.sheets.find(s => s.id === S.curId)) S.curId = S.sheets[0]?.id || null;
  renderAll();
  initCloud();
})();
</script>
